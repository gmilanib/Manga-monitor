spring.application.name=Manga-Monitor
spring.main.web-application-type=none
spring.datasource.url=jdbc:sqlite:manga-monitor.db
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
# Evita omitir INTEGER do ID SQLite quando outra coluna INTEGER vem antes dele.
spring.jpa.properties.hibernate.column_ordering_strategy=legacy
spring.jpa.show-sql=true
# Exercício: declare monitor.navegador.sem-janela como booleano (sugestão: true).
# Exercício: declare monitor.navegador.timeout-ms positivo em ms (sugestão: 45000).
